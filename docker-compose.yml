services:
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: auth_db
    ports:
      - '3307:3306'
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-prootpass']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salon-network

  auth-service:
    build: ./apps/auth-service
    env_file: ./apps/auth-service/.env
    ports:
      - '3001:3001'
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - salon-network

  mysql-booking:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: booking_db
    ports:
      - '3308:3306'
    volumes:
      - mysql-booking-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-prootpass']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salon-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salon-network

  booking-service:
    build: ./apps/booking-service
    env_file: ./apps/booking-service/.env
    ports:
      - '3002:3002'
    depends_on:
      mysql-booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - salon-network

  notification-service:
    build: ./apps/notification-service
    env_file: ./apps/notification-service/.env
    ports:
      - '3003:3003'
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - salon-network

  api-gateway:
    build: ./apps/api-gateway
    env_file: ./apps/api-gateway/.env
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - booking-service
    networks:
      - salon-network

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    ports:
      - '5173:5173'
    depends_on:
      - api-gateway
    networks:
      - salon-network

networks:
  salon-network:
    driver: bridge

volumes:
  mysql-auth-data:
  mysql-booking-data:
